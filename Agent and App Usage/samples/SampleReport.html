<style>

  .kpi .sub { color: var(--muted); font-size: 12px; }

  .tablewrap { overflow-x: auto; }

  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--surface); }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  th .arrow { opacity: .6; margin-left: 2px; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--surface-2); }
  td.name { white-space: normal; min-width: 180px; font-weight: 500; }
  .freq { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .count { color: var(--muted); font-size: 12px; margin-left: auto; }
  .drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 10; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100%); background: var(--surface); border-left: 1px solid var(--border);
    overflow-y: auto; padding: 20px; transform: translateX(100%); transition: transform .2s ease; z-index: 11; }
  .drawer.open { transform: none; }
  .drawer-bg.open { display: block; }
  .close { float: right; background: none; border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
  dl { display: grid; grid-template-columns: 160px 1fr; gap: 6px 12px; margin: 0; font-size: 13px; }
  dt { color: var(--muted); }
  dd { margin: 0; word-break: break-word; }
  .mini td, .mini th { padding: 5px 8px; white-space: normal; }
  .mini th { cursor: default; position: static; }
  .empty { color: var(--muted); font-style: italic; padding: 8px 0; }
  .notes { color: var(--muted); font-size: 12px; margin-top: 16px; }
  .notes li { margin-bottom: 4px; }
  .warn { color: var(--warn); }
</style>
</head>

</div>

  FREQ.map(f => ({ name: f, v: agents.filter(a => (a.UsageFrequency || 'Unknown') === f).length, color: FREQ_COLOR[f] })).filter(r => r.v > 0), 'v', 'name');

(function daily() {
  const el = document.getElementById('dailyChart');
  const perDay = {};
  // Use the source with most sessions per agent per day to avoid double counting.
  const best = {};
  arr(DATA.daily).forEach(d => { const k = d.AgentKey + '|' + d.Date; best[k] = Math.max(best[k] || 0, num(d.Sessions) || 0); });
  Object.entries(best).forEach(([k, v]) => { const day = k.split('|')[1]; perDay[day] = (perDay[day] || 0) + v; });
  const days = Object.keys(perDay).sort();
  if (!days.length) { el.innerHTML = '<div class="empty">No daily usage data.</div>'; return; }
  const W = 1200, H = 180, pad = 32, max = Math.max(...days.map(d => perDay[d])) || 1;
  const x = i => pad + (W - pad * 2) * (days.length === 1 ? 0.5 : i / (days.length - 1));
  const y = v => H - 24 - (H - 40) * v / max;
  const pts = days.map((d, i) => `${x(i)},${y(perDay[d])}`).join(' ');
  const area = `${x(0)},${H - 24} ${pts} ${x(days.length - 1)},${H - 24}`;
  const ticks = [0, Math.floor((days.length - 1) / 2), days.length - 1].filter((v, i, a) => a.indexOf(v) === i);
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">
    <line x1="${pad}" x2="${W - pad}" y1="${H - 24}" y2="${H - 24}" stroke="var(--border)"/>
    <polygon points="${area}" fill="var(--accent-soft)"/>
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    ${days.map((d, i) => `<circle cx="${x(i)}" cy="${y(perDay[d])}" r="7" fill="transparent"><title>${d}: ${perDay[d]} sessions</title></circle>`).join('')}
    ${ticks.map(i => `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${days[i]}</text>`).join('')}
    <text x="${pad}" y="12">peak ${fmtN(max)} / day</text></svg>`;
})();

// ---------- agents table
const COLS = [
  ['Name', 'Agent', 'name'], ['Source', 'Source'], ['EnvironmentName', 'Environment'], ['Owner', 'Owner'],
  ['LastPublishedOn', 'Published', 'date'], ['SharedUserCount', 'Shared users', 'num'], ['ToolCount', 'Tools', 'num'],
  ['ConnectorCount', 'Connectors', 'num'], ['TotalSessions', 'Sessions', 'num'], ['UniqueUsers', 'Users', 'num'],
  ['UsageFrequency', 'Frequency', 'freq'], ['LastUse', 'Last used', 'date'],
];
let sortKey = 'TotalSessions', sortDir = -1;
const fill = (id, vals) => { const s = document.getElementById(id); [...new Set(vals.filter(Boolean))].sort().forEach(v => s.insertAdjacentHTML('beforeend', `<option>${esc(v)}</option>`)); };
fill('fSource', agents.map(a => a.Source));
fill('fFreq', agents.map(a => a.UsageFrequency || 'Unknown'));

function renderTable() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const fs = document.getElementById('fSource').value, ff = document.getElementById('fFreq').value, fp = document.getElementById('fPub').value;
  let rows = agents.filter(a =>
    (!fs || a.Source === fs) && (!ff || (a.UsageFrequency || 'Unknown') === ff) && (!fp || String(bool(a.IsPublished)) === fp) &&
    (!q || [a.Name, a.Owner, a.OwnerUPN, a.EnvironmentName, a.Connectors, a.Source, a.Description].join(' ').toLowerCase().includes(q)));
  const type = (COLS.find(c => c[0] === sortKey) || [])[2];
  rows.sort((a, b) => {
    let x = a[sortKey], y = b[sortKey];
    if (type === 'num') { x = num(x) ?? -1; y = num(y) ?? -1; }
    else if (type === 'freq') { x = FREQ.indexOf(x || 'Unknown'); y = FREQ.indexOf(y || 'Unknown'); return (x - y) * -sortDir; }
    else { x = (x || '').toString().toLowerCase(); y = (y || '').toString().toLowerCase(); }
    return (x > y ? 1 : x < y ? -1 : 0) * sortDir;
  });
  document.querySelector('#agents thead').innerHTML = '<tr>' + COLS.map(([k, l, t]) =>
    `<th data-k="${k}" class="${t === 'num' ? 'num' : ''}">${esc(l)}${sortKey === k ? `<span class="arrow">${sortDir > 0 ? '▲' : '▼'}</span>` : ''}</th>`).join('') + '</tr>';
  document.querySelector('#agents tbody').innerHTML = rows.map(a => '<tr data-key="' + esc(a.AgentKey) + '">' + COLS.map(([k, , t]) => {
    const v = a[k];
    if (t === 'num') return `<td class="num">${fmtN(v)}</td>`;
    if (t === 'date') return `<td>${fmtD(v)}</td>`;
    if (t === 'freq') { const f = v || 'Unknown'; return `<td><span class="freq"><span class="dot" style="background:${FREQ_COLOR[f]}"></span>${esc(f)}</span></td>`; }
    if (t === 'name') return `<td class="name">${esc(v)}</td>`;
    return `<td>${esc(v) || '—'}</td>`;
  }).join('') + '</tr>').join('');
  document.getElementById('count').textContent = `${rows.length} of ${agents.length} agents`;
}
document.querySelector('#agents thead').addEventListener('click', e => {
  const th = e.target.closest('th'); if (!th) return;
  const k = th.dataset.k; if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = 1; }
  renderTable();
});
['q', 'fSource', 'fFreq', 'fPub'].forEach(id => document.getElementById(id).addEventListener('input', renderTable));
document.querySelector('#agents tbody').addEventListener('click', e => { const tr = e.target.closest('tr'); if (tr) openAgent(tr.dataset.key); });
renderTable();

// ---------- drawer
function miniTable(rows, cols) {
  if (!rows || !rows.length) return '<div class="empty">None found.</div>';
  return '<div class="tablewrap"><table class="mini"><thead><tr>' + cols.map(c => `<th>${esc(c[1])}</th>`).join('') + '</tr></thead><tbody>' +
    rows.map(r => '<tr>' + cols.map(c => `<td class="${c[2] === 'num' ? 'num' : ''}">${c[2] === 'num' ? fmtN(r[c[0]]) : c[2] === 'date' ? fmtD(r[c[0]]) : (esc(r[c[0]]) || '—')}</td>`).join('') + '</tr>').join('') +
    '</tbody></table></div>';
}
function sparkline(key) {
  const best = {};
  arr(dailyBy[key]).forEach(d => { best[d.Date] = Math.max(best[d.Date] || 0, num(d.Sessions) || 0); });
  const days = Object.keys(best).sort();
  if (!days.length) return '<div class="empty">No daily usage.</div>';
  const W = 580, H = 70, max = Math.max(...Object.values(best)) || 1, bw = Math.max(2, (W / days.length) - 2);
  return `<svg viewBox="0 0 ${W} ${H + 14}" width="100%">` + days.map((d, i) => {
    const h = Math.max(2, (H - 4) * best[d] / max);
    return `<rect x="${i * (W / days.length)}" y="${H - h}" width="${bw}" height="${h}" rx="1.5" fill="var(--accent)"><title>${d}: ${best[d]} sessions</title></rect>`;
  }).join('') + `<text x="0" y="${H + 12}">${days[0]}</text><text x="${W}" y="${H + 12}" text-anchor="end">${days[days.length - 1]}</text></svg>`;
}
function openAgent(key) {
  const a = agents.find(x => x.AgentKey === key); if (!a) return;
  const d = document.getElementById('drawer');
  const field = (l, v) => `<dt>${esc(l)}</dt><dd>${v === null || v === undefined || v === '' ? '—' : esc(v)}</dd>`;
  const topUsers = arr(usersBy[key]).sort((x, y) => num(y.Sessions) - num(x.Sessions)).slice(0, 25);
  d.innerHTML = `<button class="close" id="closeBtn">Close</button>
    <h2 style="font-size:18px">${esc(a.Name)}</h2>
    <div class="meta">${esc(a.Source)}${a.EnvironmentName ? ' · ' + esc(a.EnvironmentName) : ''}</div>
    <div style="margin:10px 0"><span class="pill accent">${esc(a.UsageFrequency || 'Unknown')}</span>
      ${bool(a.IsPublished) ? '<span class="pill">Published</span>' : '<span class="pill">Not published</span>'}
      ${bool(a.IsAutonomous) ? '<span class="pill">Autonomous</span>' : ''}${bool(a.UsesMCP) ? '<span class="pill">MCP</span>' : ''}
      ${a.Audience ? `<span class="pill">${esc(a.Audience)}</span>` : ''}</div>
    <h3>Usage (${esc(meta.WindowDays)} days)</h3>${sparkline(key)}
    <dl>${field('Sessions', fmtN(a.TotalSessions))}${field('Unique users', fmtN(a.UniqueUsers))}${field('Active days', fmtN(a.ActiveDays))}
      ${field('Avg sessions / day', a.AvgSessionsPerDay)}${field('First / last use', fmtD(a.FirstUse) + ' → ' + fmtD(a.LastUse))}
      ${field('Usage sources', a.UsageSources)}
      ${a.CatalogSessions30d != null ? field('Catalog sessions (30d)', fmtN(a.CatalogSessions30d)) + field('Catalog active users (30d)', fmtN(a.CatalogActiveUsers30d)) + field('Catalog last used', fmtD(a.CatalogLastUsed)) : ''}</dl>
    <h3>Lifecycle</h3>
    <dl>${field('Owner', [a.Owner, a.OwnerUPN].filter(Boolean).join(' · '))}${field('Created', fmtD(a.CreatedOn))}
      ${field('Last published', fmtD(a.LastPublishedOn))}${field('Published by', a.PublishedBy)}
      ${field('First publish (audit)', fmtD(a.FirstPublishInAudit))}${field('Publishes (audit)', a.PublishCountInAudit)}
      ${field('Status', a.Status)}${field('Authentication', a.AuthenticationMode)}${field('Orchestration', a.Orchestration)}
      ${field('Agent ID', a.AgentId)}${field('Description', a.Description)}</dl>
    <h3>Sharing · ${fmtN(a.SharedUserCount)} users reached</h3>
    ${miniTable(arr(shareBy[key]), [['PrincipalName', 'Principal'], ['PrincipalType', 'Type'], ['UserPrincipalName', 'UPN'], ['Role', 'Role'], ['GroupMemberCount', 'Members', 'num'], ['Via', 'Via']])}
    <h3>Tools</h3>${miniTable(arr(toolsBy[key]), [['ToolName', 'Name'], ['ToolType', 'Type'], ['OperationId', 'Operation'], ['AuthMode', 'Auth']])}
    <h3>Connectors</h3>${miniTable(arr(connBy[key]), [['Connector', 'Connector'], ['UsedBy', 'Used by'], ['AuthMode', 'Auth'], ['ConnectionReference', 'Connection reference']])}
    <h3>Knowledge</h3>${miniTable(arr(knowBy[key]), [['KnowledgeName', 'Name'], ['SourceType', 'Type'], ['Target', 'Target']])}
    <h3>Top users</h3>${miniTable(topUsers, [['DisplayName', 'Name'], ['UserPrincipalName', 'UPN'], ['Sessions', 'Sessions', 'num'], ['ActiveDays', 'Days', 'num'], ['LastSeen', 'Last seen', 'date']])}
    <h3>Audit events</h3>${miniTable(arr(lifeBy[key]), [['Operation', 'Operation'], ['Time', 'Time', 'date'], ['User', 'User']])}`;
  d.classList.add('open'); d.setAttribute('aria-hidden', 'false');
  document.getElementById('drawerBg').classList.add('open');
  document.getElementById('closeBtn').onclick = closeDrawer;
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer').setAttribute('aria-hidden', 'true');
  document.getElementById('drawerBg').classList.remove('open');
}
document.getElementById('drawerBg').onclick = closeDrawer;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

// ---------- notes
const notes = [
  'Sessions use the source with the most sessions per agent (sources are not added together). Unique users are merged across sources by UPN.',
  'Frequency: Daily = active on ≥50% of days in the window, Weekly = ≥1 day/week, Monthly = ≥1 day/month, Occasional = less.',
  'Dataverse transcripts are kept for 30 days by default; Purview audit covers up to 180 days (Audit Standard).',
  'Shared users counts direct users plus expanded group members (excluding the owner). Agents shared with everyone show the share only, not the tenant size.',
  ...arr(meta.Warnings).map(w => `<span class="warn">${esc(w)}</span>`),
];
document.getElementById('notes').innerHTML = notes.map(n => `<li>${n}</li>`).join('');
</script>
